<div class="filters__wrapper">
  <div class="filters__field">
    <label for="author-input" class="filters__label">Автор</label>
    <input
      id="author-input"
      type="text"
      name="filters"
      class="filters__input"
      placeholder="Имя или должность"
      aria-label="Имя или должность"
      [value]="author()"
      (input)="author.set($any($event.target).value)">

    <button
      type="button"
      class="filters__btn filters__btn--me"
      aria-label="Я"
      (click)="onMeClick()">
      <img src="icons/me.svg" alt="" aria-hidden="true" class="filters__icon">
    </button>
  </div>
  <div class="filters__group">
    <div class="filters__list">
      @for (option of options; track option.id) {
      <label class="filters__item">
        <input type="checkbox" class="filters__checkbox">
        <span class="filters__icon-box">
          <img [src]="option.icon" alt="" aria-hidden="true" class="filters__check-icon">
        </span>
        <span class="filters__item-text">{{ option.label }}</span>
      </label>
      }
    </div>
  </div>
  <div class="filters__group">
    <h3 class="filters__subtitle">Только</h3>
    <div class="filters__list">
      @for (item of onlyOptions; track item.id) {
      <label class="filters__item">
        <input type="checkbox" class="filters__checkbox">
        <span class="filters__icon-box">
          <img [src]="item.icon" alt="" aria-hidden="true" class="filters__check-icon">
        </span>
        <span class="filters__item-text">{{ item.label }}</span>
      </label>
      }
    </div>
  </div>
</div>
