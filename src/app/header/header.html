<div class="header__left">
  <button type="button" class="header__btn header__btn--menu" aria-label="Меню">
    <img src="icons/menu.svg" alt="" aria-hidden="true" class="header__icon">
  </button>
  <a href="/" class="header__logo-link">
    <img src="icons/logo.svg" alt="Логотип" class="header__logo">
  </a>
</div>
<div class="header__right">
  <button type="button" class="header__btn" aria-label="Добавить">
    <img src="icons/add.svg" alt="" aria-hidden="true" class="header__icon">
  </button>
  <button type="button" class="header__btn" aria-label="История">
    <img src="icons/history.svg" alt="" aria-hidden="true" class="header__icon">
  </button>
  <button type="button" class="header__btn" aria-label="Поиск" (click)="onSearchClick()">
    <img src="icons/search.svg" alt="" aria-hidden="true" class="header__icon">
  </button>
  <button type="button" class="header__btn" aria-label="Уведомления">
    <img src="icons/notifications.svg" alt="" aria-hidden="true" class="header__icon">
  </button>
</div>
