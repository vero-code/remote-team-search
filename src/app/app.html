@if (isSearchOpen()) {
  <app-search
    class="search-mobile-only"
    (closeSearch)="closeAll()"
    (openFilters)="isFiltersOpen.set(true)"/>
}

<app-header
  [class.header-mobile-hidden]="isSearchOpen()"
  [isSearchOpen]="isSearchOpen()"
  (openSearch)="isSearchOpen.update(v => !v)"
  (closeSearch)="isSearchOpen.set(false)"
  (openFilters)="isFiltersOpen.set(true)"
/>

@if (isFiltersOpen()) {
  <app-filters />
}

<router-outlet />
