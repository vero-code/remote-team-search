<div class="search__wrapper">
  <button type="button" class="search__btn search__btn--close" aria-label="Закрыть" (click)="onCloseClick()">
    <img src="icons/arrow_back.svg" alt="" aria-hidden="true" class="search__icon">
  </button>
  <div class="search__input-box">
    <input 
      type="search" 
      name="search" 
      class="search__input" 
      placeholder="Поиск" 
      aria-label="Поиск"
      [value]="query()"
      (input)="onInput($event)"
    >
    @if (query()) {
      <button type="button" class="search__btn search__btn--clear" aria-label="Очистить" (click)="onClear()">
        <img src="icons/cancel.svg" alt="" aria-hidden="true" class="search__icon">
      </button>
    }
  </div>
</div>
